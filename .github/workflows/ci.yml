name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build & Package (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows
            runner: windows-latest
            targets: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: linux
            runner: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
          - name: macos-arm64-x64
            os: macos
            runner: macos-15-intel
            targets: x86_64-apple-darwin aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config cmake clang dpkg-dev \
            libssl-dev libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libvulkan-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Test, build & verify Windows installer
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc
          cargo build --release --locked --target x86_64-pc-windows-msvc
          & .\packaging\windows\build-setup.ps1 `
            -BinaryPath "target\x86_64-pc-windows-msvc\release\texreq.exe" `
            -Version "0.0.0" `
            -Tag "ci" `
            -OutDir "dist"

      - name: Test, build & verify Linux .deb + tarball
        if: matrix.os == 'linux'
        run: |
          cargo test --locked --target x86_64-unknown-linux-gnu
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          bash packaging/linux/build-deb.sh "target/x86_64-unknown-linux-gnu/release/texreq" "0.0.0" "ci" "dist"
          dpkg-deb -I dist/texreq-ci-linux-x86_64.deb

      - name: Test, build & verify macOS .dmg + .zip
        if: matrix.os == 'macos'
        run: |
          cargo test --locked --target x86_64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          bash packaging/macos/build-dmg.sh "target/aarch64-apple-darwin/release/texreq" "0.0.0" "ci" "macos-arm64" "dist"
          bash packaging/macos/build-dmg.sh "target/x86_64-apple-darwin/release/texreq" "0.0.0" "ci" "macos-x86_64" "dist"
