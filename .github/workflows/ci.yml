name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            run_tests: true
          - name: linux-x86_64
            os: linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run_tests: true
          - name: macos-arm64
            os: macos
            runner: macos-latest
            target: aarch64-apple-darwin
            run_tests: true
          - name: macos-x86_64
            os: macos
            runner: macos-latest
            target: x86_64-apple-darwin
            run_tests: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config cmake clang \
            libssl-dev libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libvulkan-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Run unit tests
        if: matrix.run_tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
